[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "creativity-engine-mcp"
version = "1.0.9"
readme = "README.md"
description = "Creativity Engine Mcp: find bisociations (Find creative bisociations between two concepts (Koestler's ); assess creativity (Score an idea across 5 creativity dimensions: novelty, utili); compute novelty (Compute novelty score by comparing against known solutions i); suggest exploration (Suggest unexplored conceptual territories for creative explo). pip install creativity-engine-mcp."
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [{name = "MEOK AI Labs", email = "nicholas@meok.ai"}]
keywords = ["mcp", "meok", "ai"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["mcp>=1.0.0"]
[project.urls]
Homepage = "https://meok.ai"
Repository = "https://github.com/CSOAI-ORG/creativity-engine-mcp"
[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["server.py", "auth_middleware.py"]

[project.scripts]
creativity_engine_mcp = "server:main"
